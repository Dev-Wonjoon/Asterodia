name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows tests and build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          test-tools: 'true'
      - name: Validate workflows and version
        id: validate
        shell: pwsh
        run: |
          actionlint
          if ($LASTEXITCODE -ne 0) { throw 'Workflow validation failed.' }
          $version = (node tools/release-version.mjs --check).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Version resources are inconsistent.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          ./tests/packaging/verify-release.test.ps1
      - name: Frontend tests and build
        shell: pwsh
        run: |
          npm --prefix frontend test -- --reporter=dot
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
      - name: Go tests and static analysis
        shell: pwsh
        run: ./tests/run-go-tests.ps1
      - name: Build verified Windows amd64 executable
        shell: pwsh
        run: ./tools/prepare-release.ps1 -Arch amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-windows-amd64
          path: dist/releases/v${{ steps.validate.outputs.version }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
